repos:
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx prettier --write --ignore-unknown --
        language: system
        types_or: [javascript, ts, svelte, css, json, markdown, yaml, html]

      - id: svelte-check
        name: svelte-check
        entry: npm run --silent check
        language: system
        types_or: [javascript, ts, svelte, css, json]
        pass_filenames: false
